# Optional: sandboxes the bot. Remove this file (and run `systemctl daemon-reload`) to undo it.
# Compare before and after with `systemd-analyze security grokbot`.
[Service]
# Filesystem isolation
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
InaccessiblePaths=/boot /media /mnt
# The database and its WAL files are private to the service's user, so two bots can't share a DB_PATH
# under different users.
UMask=0077

# Privilege restrictions
AmbientCapabilities=
CapabilityBoundingSet=
LockPersonality=yes
NoNewPrivileges=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
# Do NOT add MemoryDenyWriteExecute=yes: the MCP servers started with npx are Node, whose JIT needs
# writable-and-executable memory, so they would crash at startup.
SystemCallArchitectures=native
# A call outside @system-service fails with an error instead of killing the process. If a tool
# misbehaves after a change, suspect this first.
SystemCallErrorNumber=EPERM
SystemCallFilter=@system-service
LimitCORE=0

# Kernel and system protection
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes

# Process isolation
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=yes

# Network: HTTPS to the LLM, Telegram and the MCP servers. AF_UNIX is for asyncio and name lookups.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
# On a cloud VM, keep the bot away from the metadata server (it hands out the VM's credentials),
# unless your DNS resolver is that address (check /etc/resolv.conf):
# IPAddressDeny=169.254.169.254

# Resources: the bot and its npx MCP servers share these. After a busy request look at
# `systemctl status grokbot` (peak memory, task count) and raise them if it is being throttled.
TasksMax=64
MemoryAccounting=yes
MemoryHigh=200M
MemoryMax=300M
