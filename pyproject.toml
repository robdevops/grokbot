[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["bot_monolith.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C901", "PLR0915", "PLR0912"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.pylint]
max-statements = 70
max-branches = 20

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
